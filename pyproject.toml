[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omok-finals"
version = "0.1.0"
description = "Console omok game implemented with MVC and small objects."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pylint",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pylint.main]
py-version = "3.10"

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",
]

[tool.pylint.format]
max-line-length = 100

[tool.setuptools.packages.find]
where = ["."]
include = ["omok*"]
